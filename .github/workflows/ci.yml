name: CI / Quality Gate & Security Audits

on:
  push:
    branches:
      - main
      - develop
      - test
  pull_request:
    branches:
      - main
      - develop
      - test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Lint, Static Analysis, TypeScript Types & Test Suites
  # ----------------------------------------------------------------------------
  quality-gate:
    name: Code Quality & Security Test Suites
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck (TypeScript Strict Mode)
        run: npm run typecheck

      - name: Lint (Next.js & ESLint)
        run: npm run lint

      - name: Supabase RLS & Multi-Tenant Isolation Audit
        run: npm run test:rls

      - name: Field Pilot QA & TTV SLA Simulation
        run: npm run test:field

      - name: Menu Flow & Local Resilient Auth Suite
        run: npm run test:flow

  # ----------------------------------------------------------------------------
  # Job 2: Dockerfile & Container Parity Verification
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker Environment & Container Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Multi-stage Development Image
        run: docker build --target dev -t nexo-app:dev .

      - name: Build Production Image
        run: docker build --target runner -t nexo-app:prod .
